name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run Tests
        run: uv run pytest .

      - name: Type Check
        run: uv run ty check .

      - name: Lint
        run: uv run ruff check .
